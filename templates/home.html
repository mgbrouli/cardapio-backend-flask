<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Cardápio Pizza</title>
</head>

<body class="bg-light">






    <header class="bg-dark text-white py-4 mb-4 shadow">
        <div class="container">
            <h1 class="text-center mb-4">🍕 Gestão de Cardápio</h1>
            <form action="/add" method="post" class="row g-2 bg-white p-3 rounded shadow-sm">

                <div class="col-md-3">
                    <input type="file" name="image" id="image" accept=".jpg, .jpeg, .png, .avif, .webp" hidden>

                    <label for="image" class="btn-upload">
                        <i class="fas fa-image"></i> Selecionar Imagem
                    </label>

                    <div id="file-name" class="file-name-text">Nenhum arquivo selecionado</div>
                </div>
                <div class="col-md-4">
                    <input type="text" name="nome" class="form-control" placeholder="Nome da Pizza" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="ingredientes" class="form-control"
                        placeholder="Ingredientes (ex: Queijo, Tomate)">
                </div>
                <div class="col-md-2">
                    <div class="input-group">
                        <span class="input-group-text">R$</span>
                        <input type="number" name="preco" min="0" step="0.01" value="0.00" class="form-control">
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Criar Pizza</button>
                </div>
            </form>
        </div>
    </header>

    <main class="container">
        <h5 class="mb-4 text-secondary border-bottom pb-2">Itens Cadastrados</h5>

        <div class="row">
            {% for item in produto%}
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card h-100 shadow-sm">
                    {% if item.imagem %}
                    <img src="data:image/jpeg;base64,{{ item.imagem.image.hex() | replace('0', '0') }}"
                        alt="{{ item.produto.nome }}" class="card-img-top" style="height: 200px; object-fit: cover;">
                    {% else %}
                    <div class="card-img-top bg-secondary d-flex align-items-center justify-content-center"
                        style="height: 200px;">
                        <span class="text-white">Sem imagem</span>
                    </div>
                    {% endif %}
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start">
                            <h2 class="card-title h5 text-uppercase fw-bold">{{ item.produto.nome }}</h2>
                            <span class="badge bg-warning text-dark">R$ {{ "%.2f"|format(item.produto.preco|float)
                                }}</span>
                        </div>
                        <p class="card-text text-muted small flex-grow-1">
                            {{ item.produto.ingredientes }}
                        </p>
                        <div class="mt-3">
                            <button class="btn btn-outline-danger btn-sm w-100 btn-deletar"
                                data-id="{{ item.produto.id }}">
                                🗑️ Excluir Produto
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

    <script>
        document.querySelectorAll('.btn-deletar').forEach(botao => {
            botao.addEventListener('click', function () {
                const id = this.getAttribute('data-id');
                if (confirm("Tem certeza que deseja apagar esta pizza?")) {
                    fetch(`/remove/${id}`, {
                        method: 'DELETE',
                    }).then(response => {
                        if (response.ok) {
                            window.location.reload();
                        } else {
                            alert('Erro ao deletar no servidor');
                        }
                    }).catch(err => console.error('Erro: ', err));
                }
            })
        })

        document.getElementById('image').addEventListener('change', function () {
            var fileName = this.files[0] ? this.files[0].name : "Nenhum arquivo selecionado";

            document.getElementById('file-name').textContent = fileName;
        });
    </script>
</body>

</html>
