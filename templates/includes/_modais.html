<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold">Acesse seu Painel</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" {% if erro_login %}disabled{% endif %}></button>
            </div>
            <div class="modal-body p-4">
                {% if erro_login %}
                <div class="alert alert-danger fade show mb-3" role="alert">
                    <i class="bi bi-exclamation-circle me-2"></i>
                    <strong>Erro:</strong> {{ erro_login }}
                </div>
                {% endif %}
                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">E-mail</label>
                        <input type="email" name="email" class="form-control" placeholder="seu@email.com" value="{{ email_login or '' }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Senha</label>
                        <input type="password" name="senha" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold shadow-sm">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Abrir modal de login automaticamente se houver erro
document.addEventListener('DOMContentLoaded', function() {
    if (document.querySelectorAll('#loginModal .alert-danger').length > 0) {
        const loginModal = new bootstrap.Modal(document.getElementById('loginModal'), {
            backdrop: 'static',
            keyboard: false
        });
        loginModal.show();
    }
});
</script>

<div class="modal fade" id="cadastroModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold">Comece a vender online</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form action="{{ url_for('auth.cadastro') }}" method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">E-mail Administrativo</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Senha de Acesso</label>
                            <input type="password" name="senha" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nome do Estabelecimento</label>
                            <input type="text" name="nome_loja" class="form-control" placeholder="Ex: Pizzaria do Zé" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">WhatsApp para Pedidos</label>
                            <input type="tel" name="whatsapp" class="form-control" placeholder="5511999999999" required>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold shadow-sm">
                                Criar meu Cardápio Grátis
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
