<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Cardápio Pizza</title>
</head>

<body class="bg-light">


    <header class="bg-dark text-white py-4 mb-4 shadow">
        <div class="container">
            <div class="d-flex align-items-center justify-content-center gap-3">
                <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo" class="rounded-circle"
                    style="width:56px; height:56px; object-fit:cover;">
                <div class="text-center">
                    <h1 class="h4 mb-0">Pizzaria Exemplo</h1>
                    <small class="text-white-50">Cardápio de Pizzas</small>
                </div>
            </div>
        </div>

    </header>

    <main class="container">
        <h5 class="mb-4 text-secondary border-bottom pb-2">Pizzas da lista</h5>

        <div class="row">
            {% for item in produto %}
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card h-100 shadow-sm">
                    {% if item.imagem %}
                    <img src="data:image/jpeg;base64,{{ item.imagem }}" alt="{{ item.produto.nome }}"
                        class="card-img-top" style="height: 200px; object-fit: cover;">
                    {% else %}
                    <div class="card-img-top bg-secondary d-flex align-items-center justify-content-center"
                        style="height: 200px;">
                        <span class="text-white">Sem imagem</span>
                    </div>
                    {% endif %}
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start">
                            <h2 class="card-title h5 text-uppercase fw-bold">{{ item.produto.nome }}</h2>
                            <span class="badge bg-warning text-dark">R$ {{ "%.2f"|format(item.produto.preco|float)
                                }}</span>
                        </div>
                        <p class="card-text text-muted small flex-grow-1">
                            {{ item.produto.ingredientes }}
                        </p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>
    <div class="modal fade" id="pizzaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header border-0">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="row align-items-center">
                    <div class="col-md-6 mb-3 mb-md-0 text-center">
                        <img src="" id="modalImg" class="img-fluid rounded shadow" style="max-height: 400px; width: 100%; object-fit: cover;">
                    </div>
                    <div class="col-md-6">
                        <h2 id="modalNome" class="fw-bold text-uppercase mb-2"></h2>
                        <h4 id="modalPreco" class="text-success fw-bold mb-3"></h4>
                        <hr>
                        <p class="text-muted mb-1 small text-uppercase fw-bold">Ingredientes:</p>
                        <p id="modalIngredientes" class="lead fs-6"></p>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const pizzaModal = new bootstrap.Modal(document.getElementById('pizzaModal'));
        const modalImg = document.getElementById('modalImg');
        const modalNome = document.getElementById('modalNome');
        const modalPreco = document.getElementById('modalPreco');
        const modalIngredientes = document.getElementById('modalIngredientes');

        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', () => {
                const imgSrc = card.querySelector('img') ? card.querySelector('img').src : '';
                const nome = card.querySelector('.card-title').innerText;
                const preco = card.querySelector('.badge').innerText;
                const ingredientes = card.querySelector('.card-text').innerText;

                modalImg.src = imgSrc;
                modalNome.innerText = nome;
                modalPreco.innerText = preco;
                modalIngredientes.innerText = ingredientes;

                pizzaModal.show();
            });
        });
    </script>

</body>

</html>
